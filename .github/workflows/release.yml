# Builds Notes MD for Windows and Linux and publishes the installers as a GitHub Release.
#
# Release:  push a version tag — no manual version bump needed:
#             git tag v0.2.0
#             git push notes-md v0.2.0
#           The app version and file names are taken from the tag.
# Test run: Actions tab → "Release" → "Run workflow". Builds everything and keeps the files as
#           workflow artifacts (downloadable from the run page) without publishing a release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload files

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create GitHub release (once, before the builds upload to it)
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; builds will add/replace files."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Notes MD $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  build:
    name: ${{ matrix.name }}
    needs: create-release
    # Also run for manual test builds, where create-release is skipped.
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            # One glob per line (upload-artifact needs a newline-separated list).
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
          # Oldest supported Ubuntu, so the .deb/.rpm/AppImage also run on older distros (glibc).
          - name: Linux x64
            os: ubuntu-22.04
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      FILES: ${{ matrix.files }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev build-essential file patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const toml = "src-tauri/Cargo.toml";
            fs.writeFileSync(toml, fs.readFileSync(toml, "utf8").replace(/^version = ".*"$/m, `version = "${v}"`));
          ' "$VERSION"
          echo "Building version $VERSION"

      - name: Install npm packages
        run: npm ci

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build app and installers
        run: npm run tauri build

      - name: List built files
        run: ls -la $FILES # unquoted on purpose: each line is a glob

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: notes-md-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Upload files to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" $FILES --repo "$GITHUB_REPOSITORY" --clobber
